name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Release version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: npm run check:release-tag

  package:
    name: Plugin package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: dsh-mobile-*.tgz
          if-no-files-found: error

  android:
    name: Android package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1
          cache-provider: basic
      - run: gradle --no-daemon testDebugUnitTest assembleDebug
        working-directory: apps/mobile/android
      - name: Name Android package
        run: cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "dsh-mobile-android-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-package
          path: dsh-mobile-android-${{ github.ref_name }}.apk
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [package, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: true
          files: release-assets/*
